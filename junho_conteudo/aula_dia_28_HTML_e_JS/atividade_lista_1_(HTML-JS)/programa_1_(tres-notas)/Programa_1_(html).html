<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média Notas</title>
</head>
<body bgcolor="Honeydew">
    
   <center>
    <h2>Média Notas</h2>

    <label>Segunda Nota</label> <br> <input id="inptDois" placeholder="Digite uma nota"> <br><br>
    <label>Terceira Nota</label> <br> <input id="inptTres" placeholder="Digite uma nota"> <br><br>
    <button onclick="MediaNotas()">Calcular média</button>

   </center>

    <script src="Programa_1_(tres notas).js"></script>

</body>
</html>
