<!-- 4) Criar um sistema para compra de produtos + desconto, com HTML e JS.
O sistema deve deve seguir o layout anexo (imagem).

  - O usuário deverá informar dados de 4 produtos (descrição, quantidade e valor).
  - Um percentual de desconto deve ser informado.
  - Ao final deve ser mostrado o valor total da compra com o desconto. -->

  <!DOCTYPE html>
  <html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra e Desconto de Produtos</title>
  </head>
  <body bgcolor="LightBlue">
    
      <center>
       <h2>Compra e Desconto de Produtos</h2>
       <h3><label>Descrição</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <label>Quantidade</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <label>Valor</label></h3>
       
       <input placeholder="Produto 1"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <input id="quantProdutoUm" style="width:28px;height:15px"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <input id="valorUm" style="width:55px;height:15px"> <br><br>

       <input placeholder="Produto 2"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <input id="quantProdutoDois" style="width:28px;height:15px"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <input id="valorDois" style="width:55px;height:15px"> <br><br>

       <input placeholder="Produto 3"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <input id="quantProdutoTres" style="width:28px;height:15px"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <input id="valorTres" style="width:55px;height:15px"> <br><br>

       <input placeholder="Produto 4"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <input id="quantProdutoQuatro" style="width:28px;height:15px"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
       <input id="valorQuatro" style="width:55px;height:15px"> <br><br>

       <h3><label>Percentual de Desconto</label> &nbsp;&nbsp; <input id="inptDesconto" style="width:55px;height:15px"></h3>

       <button onclick="Calcular()">Calcular</button> <input id="valorFinal" placeholder="Valor Final" readonly>



      </center>

    <script src="Programa_4_(compra-desconto-produtos).js"></script>

  </body>
  </html>
