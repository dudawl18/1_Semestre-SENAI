<!-- 1) Criar um sistema (de acordo com a imagem) onde o usuário digite seu peso e altura, 
seja calculado o IMC (peso / altura * altura). Mostrar no campo de IMC o valor do IMC com duas casas após a vírgula,
 e no campo resultado o resultado de acordo com a tabela abaixo.

IMC menor que 15 -> "Muito abaixo do Peso"
IMC igual ou maior que 15 e menor que 18 -> "Abaixo do Peso"
IMC igual ou maior que 18 e menor que 25 -> "Peso Adequado"
IMC igual ou maior que 25 e menor que 28 -> "Acima do Peso"
IMC igual ou maior que 28 -> "Muito acima do Peso" -->

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultor de IMC</title>
    <link rel="stylesheet" href="Programa_1_(css).css">
</head>

<body>

    <div class="tudo">

        <div class="tabela">
            <div class="titulo">
                <h2>Calculador de IMC</h2>
            </div>
            <div class="inputs-content">
                <label>Peso</label> <input id="peso" style="width:75px;height:15px"><br><br>
                <label>Altura</label> <input id="altura" style="width:75px;height:15px"><br><br>

                <button onclick="Calculo()">Calcular</button><br><br>

                <label>IMC</label> <input id="imc" style="width:75px;height:15px" readonly><br><br>
                <label>Resultado</label> <input id="resultado" style="width:150px;height:15px" readonly><br><br>
            </div>


        </div>

    </div>

    <script src="Programa_1_(IMC).js"></script>

</body>

</html>
